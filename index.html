on costs"},{"ru":"Равный рыночный спрос","en":"The same market demand"}],"answer":1,"explain":{"ru":"На одной кривой безразличия разные комбинации благ дают одинаковый уровень удовлетворения.","en":"Different bundles on an indifference curve give the consumer equal satisfaction."}},{"id":"Q04","topic":"basics","ru":"Кто оценивает предельную полезность при выборе товара?","en":"Who considers marginal utility when choosing what to buy?","options":[{"ru":"Регулятор денежного обращения","en":"A monetary regulator"},{"ru":"Только работодатель","en":"Only an employer"},{"ru":"Только бухгалтер фирмы","en":"Only a company accountant"},{"ru":"Потребитель","en":"A consumer"},{"ru":"Государственный статистик","en":"A government statistician"}],"answer":3,"explain":{"ru":"Предельная полезность описывает дополнительное удовлетворение потребителя от ещё одной единицы блага.","en":"Marginal utility is the extra satisfaction a consumer gains from one more unit."}},{"id":"Q05","topic":"basics","ru":"Как меняется бюджетная линия, если доход вырос, а цены обоих товаров остались прежними?","en":"What happens to a budget line when income rises and both prices stay fixed?","options":[{"ru":"Параллельно сдвигается наружу","en":"It shifts outward in parallel"},{"ru":"Непременно становится вертикальной","en":"It necessarily becomes vertical"},{"ru":"Сдвигается внутрь","en":"It shifts inward"},{"ru":"Исчезает","en":"It disappears"},{"ru":"Меняет наклон без сдвига","en":"Only its slope changes"}],"answer":0,"explain":{"ru":"Покупательная способность увеличивается; при неизменных относительных ценах наклон линии не меняется.","en":"Higher income expands purchasing power without changing the slope when prices stay constant."}},{"id":"Q06","topic":"basics","ru":"Что измеряет излишек потребителя при покупке?","en":"What does consumer surplus measure?","options":[{"ru":"Расходы продавца","en":"The seller’s expenses"},{"ru":"Сумму налогов и цены","en":"Taxes plus price"},{"ru":"Разность между готовностью платить и фактической ценой","en":"Willingness to pay minus actual price"},{"ru":"Выручку предприятия","en":"Business revenue"},{"ru":"Разность затрат и прибыли фирмы","en":"Costs minus firm profit"}],"answer":2,"explain":{"ru":"Излишек потребителя = максимальная готовность платить − фактическая цена.","en":"Consumer surplus = maximum willingness to pay − amount actually paid."}},{"id":"Q07","topic":"costs","ru":"Какой пример лучше всего отражает постоянные издержки за короткий период?","en":"Which is a typical short-run fixed cost?","options":[{"ru":"Сырьё на каждую единицу изделия","en":"Raw materials per item"},{"ru":"Оплата упаковки каждой единицы","en":"Packaging cost per item"},{"ru":"Комиссия за каждую продажу","en":"Commission per sale"},{"ru":"Плата за аренду помещения по договору","en":"Contractual rent for a facility"},{"ru":"Топливо для каждой доставки","en":"Fuel per delivery"}],"answer":3,"explain":{"ru":"Постоянные издержки в рассматриваемом периоде не зависят от выпуска; типичный пример — аренда.","en":"Fixed costs do not vary with output over the relevant period; rent is a common example."}},{"id":"Q08","topic":"costs","ru":"Какие затраты обычно растут, если предприятие производит больше единиц продукции?","en":"Which costs normally increase when a firm produces more units?","options":[{"ru":"Аренда офиса по фиксированному договору","en":"Fixed contractual office rent"},{"ru":"Сырьё для производства дополнительных единиц","en":"Materials for additional output"},{"ru":"Ежегодная фиксированная лицензия","en":"An annual fixed licence"},{"ru":"Страховой фиксированный взнос","en":"A fixed insurance premium"},{"ru":"Земельная аренда без привязки к выпуску","en":"Land rent unrelated to output"}],"answer":1,"explain":{"ru":"Переменные издержки зависят от объёма выпуска, например затраты на материалы.","en":"Variable costs depend on output, such as material costs."}},{"id":"Q09","topic":"costs","ru":"TC пяти единиц равно 300, MC шестой — 60. Сколько составляет ATC при выпуске шести единиц?","en":"TC at five units is 300 and MC of the sixth is 60. What is ATC at six units?","options":[{"ru":"50","en":"50"},{"ru":"55","en":"55"},{"ru":"60","en":"60"},{"ru":"65","en":"65"},{"ru":"360","en":"360"}],"answer":2,"explain":{"ru":"TC₆ = 300 + 60 = 360; ATC₆ = 360 / 6 = 60.","en":"TC₆ = 300 + 60 = 360, so ATC₆ = 360 / 6 = 60."}},{"id":"Q10","topic":"costs","ru":"Какая запись лучше всего определяет предельные издержки при дискретном изменении выпуска?","en":"Which expression best defines marginal cost for discrete output changes?","options":[{"ru":"FC / Q","en":"FC / Q"},{"ru":"TR − TC","en":"TR − TC"},{"ru":"TC / Q","en":"TC / Q"},{"ru":"ΔTC / ΔQ","en":"ΔTC / ΔQ"},{"ru":"P × Q","en":"P × Q"}],"answer":3,"explain":{"ru":"MC показывает прирост общих затрат при выпуске дополнительной единицы: ΔTC/ΔQ.","en":"MC measures additional total cost per unit of extra output: ΔTC/ΔQ."}},{"id":"Q11","topic":"costs","ru":"Для какой экономической единицы прежде всего важна предельная выручка (MR)?","en":"Which economic decision-maker primarily uses marginal revenue (MR)?","options":[{"ru":"Производитель, принимающий решение о выпуске","en":"A producer choosing output"},{"ru":"Только покупатель в супермаркете","en":"Only a supermarket shopper"},{"ru":"Только избиратель","en":"Only a voter"},{"ru":"Только школьник","en":"Only a school student"},{"ru":"Только домовладелец","en":"Only a landlord"}],"answer":0,"explain":{"ru":"Фирма сопоставляет MR и MC при выборе выпуска. Важно: цель — прибыль, а не сама по себе максимизация MR.","en":"Firms compare MR with MC when choosing output. Their objective is profit, not maximizing MR itself."}},{"id":"Q12","topic":"costs","ru":"Как обычно классифицируются издержки в долгосрочном периоде?","en":"How are costs classified in the long run?","options":[{"ru":"Все издержки остаются неизменными","en":"All costs remain fixed"},{"ru":"Все факторы производства могут изменяться","en":"All inputs can be adjusted"},{"ru":"Переменные затраты исчезают","en":"Variable expenses vanish"},{"ru":"Фирмы не могут сменить масштаб","en":"Firms cannot change scale"},{"ru":"Существуют только постоянные затраты","en":"Only fixed costs exist"}],"answer":1,"explain":{"ru":"В долгосрочном периоде фирма может изменить все факторы производства, поэтому нет неизменных фиксированных затрат в стандартной модели.","en":"In the standard long-run model every input is adjustable, so none is fixed."}},{"id":"Q13","topic":"costs","ru":"Какое отношение между MC и ATC возникает в минимуме кривой ATC?","en":"What relationship holds at the minimum of the ATC curve?","options":[{"ru":"MC выше ATC при любом выпуске","en":"MC is always above ATC"},{"ru":"MC равен нулю","en":"MC equals zero"},{"ru":"MC равен ATC","en":"MC equals ATC"},{"ru":"ATC равен FC","en":"ATC equals FC"},{"ru":"ATC никогда не меняется","en":"ATC never changes"}],"answer":2,"explain":{"ru":"В точке минимума средних общих издержек предельные издержки пересекают ATC: MC = ATC.","en":"Marginal cost intersects average total cost at its minimum: MC = ATC."}},{"id":"Q14","topic":"markets","ru":"Как выглядит линия спроса при совершенной эластичности?","en":"What does a perfectly elastic demand curve look like?","options":[{"ru":"Вертикальная","en":"Vertical"},{"ru":"Горизонтальная","en":"Horizontal"},{"ru":"Возрастающая","en":"Upward sloping"},{"ru":"U-образная","en":"U-shaped"},{"ru":"Под углом 45 градусов","en":"At a 45-degree angle"}],"answer":1,"explain":{"ru":"Совершенно эластичный спрос: небольшое отклонение цены приводит к очень сильной реакции количества; линия горизонтальная.","en":"Perfectly elastic demand is drawn horizontally at a given price."}},{"id":"Q15","topic":"markets","ru":"Что вызывает перемещение точки по существующей кривой спроса, а не сдвиг всей кривой?","en":"What causes a movement along a demand curve instead of a shift?","options":[{"ru":"Изменение вкусов","en":"Changing preferences"},{"ru":"Изменение доходов","en":"Changing income"},{"ru":"Изменение цены самого товара","en":"Changing the good’s own price"},{"ru":"Изменение цены заменителя","en":"Changing a substitute’s price"},{"ru":"Изменение числа покупателей","en":"Changing the number of buyers"}],"answer":2,"explain":{"ru":"Цена самого товара меняет величину спроса и даёт движение вдоль кривой.","en":"A change in the good’s own price changes quantity demanded along the curve."}},{"id":"Q16","topic":"markets","ru":"Что отражает коэффициент ценовой эластичности предложения?","en":"What does price elasticity of supply measure?","options":[{"ru":"Реакцию предлагаемого количества на изменение собственной цены товара","en":"How quantity supplied responds to its own price"},{"ru":"Изменение вкусов покупателей","en":"Changing buyer preferences"},{"ru":"Влияние инфляции на зарплату","en":"How inflation affects wages"},{"ru":"Отношение прибыли к выручке","en":"Profit divided by revenue"},{"ru":"Реакцию спроса на доход","en":"How demand responds to income"}],"answer":0,"explain":{"ru":"Es = процентное изменение объёма предложения / процентное изменение цены.","en":"Es = percentage change in quantity supplied / percentage change in price."}},{"id":"Q17","topic":"markets","ru":"Найдите равновесную цену: Qd = 500 − 2P; Qs = 200 + 4P.","en":"Find equilibrium price: Qd = 500 − 2P; Qs = 200 + 4P.","options":[{"ru":"30","en":"30"},{"ru":"40","en":"40"},{"ru":"50","en":"50"},{"ru":"60","en":"60"},{"ru":"80","en":"80"}],"answer":2,"explain":{"ru":"При равновесии 500 − 2P = 200 + 4P, то есть 300 = 6P, P = 50.","en":"At equilibrium: 500 − 2P = 200 + 4P, so 6P = 300 and P = 50."}},{"id":"Q18","topic":"markets","ru":"Найдите равновесный объём: Qd = 800 − 2P; Qs = 200 + 3P.","en":"Find equilibrium quantity: Qd = 800 − 2P; Qs = 200 + 3P.","options":[{"ru":"120","en":"120"},{"ru":"400","en":"400"},{"ru":"500","en":"500"},{"ru":"560","en":"560"},{"ru":"600","en":"600"}],"answer":3,"explain":{"ru":"800 − 2P = 200 + 3P; P = 120. Затем Q = 800 − 240 = 560.","en":"Equilibrium price P = 120; substitute back: Q = 800 − 240 = 560."}},{"id":"Q19","topic":"markets","ru":"Цена растёт с 1,20 до 1,40, количество предложения с 1200 до 1600. Чему примерно равна эластичность по методу средней точки?","en":"Price rises from 1.20 to 1.40, and quantity supplied from 1,200 to 1,600. Approximate midpoint elasticity?","options":[{"ru":"0.54","en":"0.54"},{"ru":"1.00","en":"1.00"},{"ru":"1.43","en":"1.43"},{"ru":"1.86","en":"1.86"},{"ru":"2.50","en":"2.50"}],"answer":3,"explain":{"ru":"Es = (400/1400) / (0,20/1,30) ≈ 1,86.","en":"Es = (400/1400) / (0.20/1.30) ≈ 1.86."}},{"id":"Q20","topic":"markets","ru":"Какой спрос наблюдает отдельная фирма при совершенной конкуренции?","en":"What demand curve does an individual perfectly competitive firm face?","options":[{"ru":"Горизонтальную линию на рыночной цене","en":"A horizontal line at the market price"},{"ru":"Вертикальную линию","en":"A vertical line"},{"ru":"Только возрастающую линию","en":"Only an upward-sloping line"},{"ru":"Отсутствие спроса","en":"No demand"},{"ru":"Обязательно U-образную кривую","en":"A necessarily U-shaped curve"}],"answer":0,"explain":{"ru":"Фирма — price taker: продаёт по заданной рыночной цене, спрос на её продукцию совершенно эластичен.","en":"A competitive firm is a price taker and faces perfectly elastic demand at the market price."}},{"id":"Q21","topic":"markets","ru":"Для пшеницы приведены пары спроса и предложения: при P=2,00 — 10 и 40; P=1,75 — 15 и 35; P=1,50 — 20 и 20. Где равновесие?","en":"Wheat supply and demand: at P=2.00 — 10 and 40; P=1.75 — 15 and 35; P=1.50 — 20 and 20. Where is equilibrium?","options":[{"ru":"P=2,00, Q=40","en":"P=2.00, Q=40"},{"ru":"P=1,75, Q=35","en":"P=1.75, Q=35"},{"ru":"P=1,50, Q=20","en":"P=1.50, Q=20"},{"ru":"P=1,75, Q=15","en":"P=1.75, Q=15"},{"ru":"Нет равновесия","en":"There is no equilibrium"}],"answer":2,"explain":{"ru":"Равновесие достигается, когда Qd=Qs=20, при цене 1,50.","en":"Equilibrium requires Qd=Qs=20, which occurs at price 1.50."}},{"id":"Q22","topic":"markets","ru":"При каком условии конкурентной фирме выгодно остановить увеличение выпуска?","en":"At what condition does a competitive firm stop increasing output to maximize profit?","options":[{"ru":"TC=FC","en":"TC=FC"},{"ru":"TR=0","en":"TR=0"},{"ru":"P=0","en":"P=0"},{"ru":"MC=ATC всегда","en":"MC=ATC always"},{"ru":"MR=MC (при соблюдении других условий)","en":"MR=MC (subject to relevant operating conditions)"}],"answer":4,"explain":{"ru":"Оптимальный положительный выпуск обычно находят по MR=MC с проверкой условий работы фирмы.","en":"Profit-maximizing positive output is typically where MR=MC, subject to operating conditions."}},{"id":"Q23","topic":"markets","ru":"Что происходит с предложением товара, если дорожает ключевое сырьё при прочих равных?","en":"What happens to supply if a key input becomes more expensive, other things equal?","options":[{"ru":"Предложение сдвигается вправо","en":"Supply shifts right"},{"ru":"Предложение сдвигается влево","en":"Supply shifts left"},{"ru":"Спрос обязательно сдвигается вправо","en":"Demand necessarily shifts right"},{"ru":"Спрос становится вертикальным","en":"Demand becomes vertical"},{"ru":"Объём предложения не может измениться","en":"Quantity supplied cannot change"}],"answer":1,"explain":{"ru":"Рост издержек снижает объём, который производители готовы предложить при каждой цене.","en":"Higher input costs reduce the amount firms supply at each given price."}},{"id":"Q24","topic":"markets","ru":"Какой признак характерен для олигополии?","en":"Which feature characterizes an oligopoly?","options":[{"ru":"Бесконечно много мелких участников","en":"Infinitely many tiny firms"},{"ru":"Один поставщик без конкурентов","en":"One supplier with no competitors"},{"ru":"Несколько крупных взаимозависимых фирм","en":"A few strategically interdependent firms"},{"ru":"Отсутствие барьеров и конкуренции","en":"No barriers or rivalry"},{"ru":"Каждая фирма полностью игнорирует конкурентов","en":"Every firm ignores rival behavior"}],"answer":2,"explain":{"ru":"В олигополии решения немногих крупных фирм взаимозависимы.","en":"In oligopoly, a few major firms make strategically interdependent decisions."}},{"id":"Q25","topic":"markets","ru":"Как может повлиять обязательное повышение минимальной зарплаты на рынок продукции фирмы, если оно повышает её затраты?","en":"If a binding minimum-wage increase raises production cost, what can happen to product supply?","options":[{"ru":"Предложение сдвигается влево","en":"Supply shifts left"},{"ru":"Предложение сдвигается вправо","en":"Supply shifts right"},{"ru":"Все цены ресурсов становятся нулевыми","en":"All input prices become zero"},{"ru":"Спрос обязательно возрастает","en":"Demand must increase"},{"ru":"Объём всегда остаётся тем же","en":"Output must remain unchanged"}],"answer":0,"explain":{"ru":"При прочих равных увеличение затрат сокращает предложение; точный эффект зависит от рынка труда и производства.","en":"Higher costs tend to reduce supply, other things equal; the magnitude depends on the market."}},{"id":"Q26","topic":"markets","ru":"Если и спрос, и предложение одновременно растут, что можно утверждать наверняка?","en":"If demand and supply both increase, what is definitely true?","options":[{"ru":"Цена всегда растёт","en":"Price always rises"},{"ru":"Цена всегда падает","en":"Price always falls"},{"ru":"Количество всегда падает","en":"Quantity always falls"},{"ru":"Равновесное количество увеличивается; изменение цены неоднозначно","en":"Equilibrium quantity increases; price direction is ambiguous"},{"ru":"Равновесие исчезает","en":"Equilibrium disappears"}],"answer":3,"explain":{"ru":"Рост обоих факторов увеличивает равновесный объём; итоговая цена зависит от относительной величины сдвигов.","en":"Both shifts raise equilibrium quantity; the direction of the price change depends on their relative sizes."}},{"id":"Q27","topic":"markets","ru":"Какое событие способно сдвинуть кривую спроса на нормальный товар?","en":"Which event can shift the demand curve for a normal good?","options":[{"ru":"Только изменение его текущей цены","en":"Only a change in its own current price"},{"ru":"Рост доходов потребителей","en":"Growth in consumer incomes"},{"ru":"Перемещение вдоль самой кривой","en":"Movement along the same demand curve"},{"ru":"Увеличение уже купленного количества при той же кривой","en":"Quantity changes on the unchanged curve"},{"ru":"Изменение предельных издержек одной фирмы без других последствий","en":"One firm’s marginal cost alone without other effects"}],"answer":1,"explain":{"ru":"Неотрицательное изменение дохода для нормального блага способно увеличить спрос и сдвинуть всю кривую вправо.","en":"Higher income typically shifts demand for a normal good to the right."}}];

case 'demand-move':content=`${demand}<circle cx="188" cy="122" r="7" fill="#ffbd8b"/><circle cx="320" cy="200" r="7" fill="#b7fb87"/><text x="152" y="111" class="axis-label">E₁</text><text x="334" y="204" class="axis-label">E₂</text><path d="M208 142L298 193M286 192L300 194L292 181" stroke="#b7fb87" stroke-width="2.3" fill="none"/>`;break;

function graphs(){const t=tr();const i=state.graphIndex;const q=graphData[i];main.innerHTML=`<div class="page-head"><span class="section-tag">02 / VISUALS</span><h2>${t.graphsTitle}</h2><p>${t.graphsLead}</p></div><div class="subnav">${graphData.map((_,idx)=>`<button class="pill ${idx===i?'selected':''}" data-graph-index="${idx}">${t.scenario} 0${idx+1} ${progress.graphs[idx]?'✓':''}</button>`).join('')}</div><div class="card"><div class="question-meta"><span>${t.scenario} 0${i+1} / 04</span><span>${t.learn}</span></div><h3>${safe(q[lang])}</h3><div class="graph-layout"><div class="graph-surface">${graphSVG(q.type)}</div><div><div class="options">${q.o[lang].map((option,idx)=>{const selected=state.graphChoice===idx;const c=state.graphChecked&&idx===q.ans?'correct':state.graphChecked&&selected?'incorrect':selected?'selected':'';return `<button class="option ${c}" data-graph-choice="${idx}" ${state.graphChecked?'disabled':''}><span class="letter">${'ABCD'[idx]}</span><span>${safe(option)}</span></button>`}).join('')}</div>${state.graphChecked?`<div class="explanation ${state.graphChoice===q.ans?'':'bad'}"><strong>${state.graphChoice===q.ans?t.correct:t.incorrect}</strong> ${safe(q.ex[lang])}</div>`:''}<div class="question-actions"><button class="btn primary" data-action="graph-check" ${state.graphChecked?'disabled':''}>${t.confirm}</button><button class="btn minor" data-action="graph-next">${t.next}</button></div></div></div></div>${footer()}`}
function params(k){const B=2+k%3,D=3+k%4,P=20+5*(k%4),C=70+12*k,A=C+(B+D)*P,Qcap=75+5*k,atc8=40+3*k,mc9=18+2*k,a=96+3*k,qv=14+k,fc=45+5*k,aa=32+k%4*2,bb=4.5+(k%3)*.3,cc=.62+(k%3)*.08;
const vc=[0];for(let q=1;q<=10;q++)vc.push(Math.round(aa*q-bb*q*q+cc*q*q*q));const table=[];let optimal=0;const marketPrice=30+4*k;for(let q=1;q<=10;q++){const mc=vc[q]-vc[q-1];if(mc<=marketPrice)optimal=q;table.push({q,fc,vc:vc[q],tc:fc+vc[q],afc:fc/q,avc:vc[q]/q,atc:(fc+vc[q])/q,mc})}
return {k,B,D,P,C,A,Qcap,rev:P*Qcap,atc8,mc9,atc9:(atc8*8+mc9)/9,a,qv,mc:a-4*qv,marketPrice,table,optimal}}
function calcHeader(){const t=tr();return `<div class="page-head"><span class="section-tag">03 / NUMBERS</span><h2>${t.calcTitle}</h2><p>${t.calcLead}</p></div><div class="subnav">${[0,1,2,3].map(i=>`<button class="pill ${i===state.calcIndex?'selected':''}" data-calc-index="${i}">${t.task} 3.${i+1} ${progress.calc[i]?'✓':''}</button>`).join('')}</div><div class="field-row"><label for="variantSelect" class="eyebrow">${t.variant}</label><select id="variantSelect" aria-label="${t.variant}">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${state.variant===i+1?'selected':''}>0${i+1}</option>`).join('')}</select><small class="dim">${L('Учебные числа, не экзаменационный вариант','Practice values, not an exam variant')}</small></div>`}
function input(label,key,placeholder){let v=state.calcDraft[key]??'';return `<div class="input-group"><label for="${key}">${safe(label)}</label><input type="text" class="number-input" id="${key}" data-calc-input="${key}" value="${safe(v)}" inputmode="decimal" placeholder="${placeholder??'0.00'}" autocomplete="off"></div>`}
function calcMethod(p,i){const t=tr(),l=lang;const arr=[
 {ru:`Сначала Qd = Qs: ${p.A} − ${p.B}P = ${p.C} + ${p.D}P. Значит, P* = (${p.A} − ${p.C}) / (${p.B} + ${p.D}) = ${p.P}. Затем TR = P* × Q = ${p.P} × ${p.Qcap} = ${p.rev}.`,en:`Set Qd = Qs: ${p.A} − ${p.B}P = ${p.C} + ${p.D}P. So P* = (${p.A} − ${p.C}) / (${p.B} + ${p.D}) = ${p.P}. TR = P* × Q = ${p.P} × ${p.Qcap} = ${p.rev}.`},
 {ru:`TC₈ = 8 × ATC₈ = 8 × ${p.atc8}. TC₉ = TC₈ + MC₉ = 8 × ${p.atc8} + ${p.mc9}. ATC₉ = TC₉/9 = ${fmt(p.atc9)}.`,en:`TC₈ = 8 × ATC₈ = 8 × ${p.atc8}. TC₉ = TC₈ + MC₉ = 8 × ${p.atc8} + ${p.mc9}. ATC₉ = TC₉/9 = ${fmt(p.atc9)}.`},
 {ru:`TC(Q) = ${p.a}Q − 2Q². Производная: MC = dTC/dQ = ${p.a} − 4Q. При Q = ${p.qv} получаем MC = ${p.mc}.`,en:`TC(Q) = ${p.a}Q − 2Q². Differentiate: MC = dTC/dQ = ${p.a} − 4Q. At Q = ${p.qv}, MC = ${p.mc}.`},
 {ru:`TC = FC + VC; AFC = FC/Q; AVC = VC/Q; ATC = TC/Q; MC(Q) = TC(Q) − TC(Q−1). Для Q=0 используй TC=FC. При рыночной цене P=${p.marketPrice} выбирай допустимый выпуск по предельным затратам, проверяя также прибыль и условие закрытия. Учебный ориентир для таблицы: Q*=${p.optimal}.`,en:`TC = FC + VC; AFC = FC/Q; AVC = VC/Q; ATC = TC/Q; MC(Q) = TC(Q) − TC(Q−1), with TC(0)=FC. At market price P=${p.marketPrice} choose output by marginal cost while checking profit and shutdown conditions. The table’s practice target is Q*=${p.optimal}.`}
];return arr[i][l]}
function calculations(){const t=tr();const i=state.calcIndex;const p=params(state.variant);let problem='',fields='';if(i===0){problem=`<div class="formula">Qd = ${p.A} − ${p.B}P · Qs = ${p.C} + ${p.D}P · Q = ${p.Qcap}</div>`;fields=`${input('P*','c1p','P*')}${input('TR','c1tr','TR')}`}
if(i===1){problem=`<div class="formula">ATC₈ = ${p.atc8} · MC₉ = ${p.mc9}</div>`;fields=`${input('ATC₉','c2atc','ATC₉')}`}
if(i===2){problem=`<div class="formula">TC(Q) = ${p.a}Q − 2Q² · Q = ${p.qv}</div>`;fields=`${input('MC(Q)','c3mc','MC')}`}
if(i===3){const rows=p.table.map((r,j)=>`<tr><td>${r.q}</td><td>${r.fc}</td><td>${r.vc}</td>${['tc','afc','avc','atc','mc'].map(key=>`<td><input type="text" id="tbl-${j}-${key}" data-calc-input="tbl-${j}-${key}" value="${safe(state.calcDraft[`tbl-${j}-${key}`]??'')}" inputmode="decimal" aria-label="${key.toUpperCase()} Q${r.q}" class="${state.calcFeedback?.cells?.[`tbl-${j}-${key}`]===true?'good':state.calcFeedback?.cells?.[`tbl-${j}-${key}`]===false?'bad':''}"></td>`).join('')}</tr>`).join('');problem=`<div class="formula">P = ${p.marketPrice} · Q = 1…10</div><div class="calc-table"><table><thead><tr>${['Q','FC','VC','TC','AFC','AVC','ATC','MC'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;fields=`${input(t.optimal,'c4opt','Q*')}`}
const titles=[t.calc1,t.calc2,t.calc3,t.calc4];const ask=[t.calcAsk1,t.calcAsk2,t.calcAsk3,t.calcAsk4];const method=state.calcMethod?`<div class="explanation" style="margin-top:15px">${calcMethod(p,i)}</div>`:'';
main.innerHTML=`${calcHeader()}<div class="card calc-card"><div class="question-meta"><span>${t.task} 3.${i+1}</span><span>0${state.variant} / 08</span></div><h3>${titles[i]}</h3><p class="soft">${ask[i]}</p>${problem}<div class="input-row">${fields}</div>${state.calcFeedback?`<div class="calc-feedback ${state.calcFeedback.all?'':'error'}"><strong>${state.calcFeedback.all?t.allRight:t.needsFix}</strong> ${state.calcFeedback.correct}/${state.calcFeedback.total} ${t.rightCount}.</div>`:''}<div class="question-actions"><button class="btn primary" data-action="calc-check">${t.confirm}</button><button class="btn secondary" data-action="calc-method">${state.calcMethod?t.hideMethod:t.showMethod}</button></div>${method}</div><div class="notice">${L('Значения здесь созданы для повторения методов из опубликованного экзамена. Это не официальные варианты и не отправка ответов.','These numeric values practice the confirmed method. They are not official variants or submitted answers.')}</div>${footer()}`}
function checkCalc(){const i=state.calcIndex;const p=params(state.variant);const cells={};let count=0,total=0;const check=(key,expected,tolerance)=>{const input=document.getElementById(key);const v=input?.value.trim()||'';state.calcDraft[key]=v;const ok=v!==''&&nearly(val(v),expected,tolerance);cells[key]=ok;total++;if(ok)count++};if(i===0){check('c1p',p.P,.01);check('c1tr',p.rev,.01)}else if(i===1)check('c2atc',p.atc9,.05);else if(i===2)check('c3mc',p.mc,.05);else {p.table.forEach((row,j)=>{for(const key of ['tc','afc','avc','atc','mc'])check(`tbl-${j}-${key}`,row[key],.06)});check('c4opt',p.optimal,.01)}
const all=count===total;state.calcFeedback={all,correct:count,total,cells};if(all)mark('calc',i,true);render()}

function guide(){const t=tr();const formulas=[['TC = FC + VC',L('Общие издержки','Total cost'),L('Постоянные плюс переменные затраты.','Fixed costs plus variable costs.')],['ATC = TC / Q',L('Средние общие издержки','Average total cost'),L('Затраты на единицу выпуска.','Cost per unit of output.')],['AVC = VC / Q',L('Средние переменные издержки','Average variable cost'),L('Используется также при решении о закрытии.','Also relevant to the shutdown decision.')],['AFC = FC / Q',L('Средние постоянные издержки','Average fixed cost'),L('Падает при росте выпуска, если FC постоянно.','Declines with output when FC remains fixed.')],['MC ≈ ΔTC / ΔQ',L('Предельные издержки','Marginal cost'),L('Для функции TC(Q): производная dTC/dQ.','For a function TC(Q): derivative dTC/dQ.')],['TR = P × Q',L('Совокупная выручка','Total revenue'),L('Цена, умноженная на проданное количество.','Price times quantity sold.')],['π = TR − TC',L('Экономическая прибыль','Economic profit'),L('Сравнивает выручку с общими затратами.','Revenue minus total costs.')],['MR = MC',L('Оптимальный выпуск','Profit-maximizing output'),L('Проверяй также условия продолжения работы.','Also check operating and shutdown conditions.')],['Qd = Qs',L('Рыночное равновесие','Market equilibrium'),L('Приравняй спрос и предложение, чтобы найти P*.','Set demand equal to supply to solve for P*.')],['Es = %ΔQs / %ΔP',L('Эластичность предложения','Supply elasticity'),L('Для средней точки используй средние исходного и нового значения.','Use averages of the starting and ending values for midpoint elasticity.')]];

usiness exam.')}</span></div><div class="source-item"><a href="https://github.com/ogaydv-prog/principles-economics/blob/main/syllabus.html" target="_blank" rel="noopener noreferrer">Principles of Economics — Syllabus</a><span>${L('Силлабус и заявленные формы оценивания.','Syllabus and assessment formats.')}</span></div><div class="notice warning"><strong>${L('Примечание об авторских правах','Copyright note')}.</strong> ${L('В публичном исходном проекте не обнаружена явная лицензия на копирование. Поэтому здесь самостоятельная реализация и перефразированные учебные вопросы, а не копия экзамена.','No explicit redistribution licence was located in the public source project. This site uses independent code and paraphrased practice questions, not an exam clone.')}</div><button class="btn ghost tiny" data-action="reset">${t.reset}</button></div>${footer()}`}

if(d.action==='case-check'){const content=$('#caseEssay').value;const ok=wordCount(content)>=100&&[...main.querySelectorAll('[data-case-check]')].every(x=>x.checked);state.caseStatus=ok?'success':'error';if(ok){mark('cases',state.caseIndex,true)}const feedback=main.querySelector('.explanation');if(feedback)feedback.remove();const box=document.createElement('div');box.className='explanation'+(ok?'':' bad');box.textContent=ok?tr().caseComplete:tr().caseTooShort;button.closest('.question-actions').before(box);return}
if(d.action==='case-next'){state.caseIndex=(state.caseIndex+1)%3;state.caseStatus='';render();return}
if(d.action==='reset'){if(window.confirm(tr().resetConfirm)){progress={questions:{},graphs:{},calc:{},cases:{}};save();toast(tr().resetDone);render()}return}
});
main.addEventListener('change',e=>{if(e.target.id==='variantSelect'){state.variant=Math.min(8,Math.max(1,Number(e.target.value)||1));state.calcDraft={};state.calcFeedback=null;state.calcMethod=false;render()}});
main.addEventListener('input',e=>{if(e.target.dataset.calcInput){state.calcDraft[e.target.dataset.calcInput]=e.target.value}if(e.target.id==='caseEssay'){const tag=$('#essayCount');if(tag)tag.textContent=wordCount(e.target.value)+' '+tr().words}});
$('#navigation').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)go(b.dataset.view)});
$('#langToggle').addEventListener('click',()=>{lang=lang==='ru'?'en':'ru';try{localStorage.setItem('econ-rk1-lang',lang)}catch{}state.quizChoice=null;state.quizChecked=false;state.graphChoice=null;state.graphChecked=false;state.caseStatus='';render()});
render();
})();

</script>
</body>
</html>
